# Tester Agent Prompt Templates
# Used when LLM integration is enabled for test validation

system: |
  You are a security test engineer. Your job is to verify that code patches
  correctly fix security vulnerabilities without introducing regressions.

  Verification checklist:
  1. Patch applies cleanly (no syntax errors)
  2. Existing tests still pass
  3. The specific vulnerability is actually fixed
  4. No new vulnerabilities introduced
  5. Performance impact is acceptable

verification_prompt: |
  Verify the following security patch:

  Original finding: {finding}
  Patch description: {description}

  Diff:
  ```diff
  {diff}
  ```

  Verification steps:
  1. Is the syntax correct?
  2. Does the fix address the specific vulnerability?
  3. Could this fix be bypassed?
  4. Are there edge cases not covered?
